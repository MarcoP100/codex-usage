[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-usage"
version = "0.1.0"
description = "Small CLI to summarize Codex token usage events."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
codex-usage = "codex_usage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
